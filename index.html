<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>h-esc | home</title>

<style>
* {
    margin:0; 
    padding:0;
    box-sizing:border-box; 
}

@font-face {
    font-family: "Endless";
    src: url("../../../_fonts/Endless_Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}


:root {
    --rect-width: clamp(280px, 80vw, 600px);
    --rect-ratio: 4 / 2; 
}

body {
    background:#000;
    color:#ccc;
    /* font-family:"Jost", system-ui, sans-serif; */
    font-family: "Endless"; 
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.main-rectangle {
    width:var(--rect-width);
    aspect-ratio:var(--rect-ratio); 
    background:#111;
    border-radius:25px;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 30px rgba(255,255,255,0.05);
    margin-bottom:10px;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.main-rectangle::after {
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.3);
}

.nav-links {
    display:flex;
    justify-content:space-between; 
    align-items:center;
    width:var(--rect-width); 
    flex-wrap:wrap;
    row-gap:12px;
}

.nav-links a {
    text-decoration:none;
    color:#424242;
    font-size:clamp(0.85rem, 1.6vw, 1rem);
    letter-spacing:0.05em;
    white-space:nowrap;
}

.nav-links a:hover { color:#aaa; }
</style>

</head>

<body>

    <div class="main-rectangle" id="mainRectangle"></div>

    <nav class="nav-links">
        <a href="projects/" data-gif="assets/main/ghost.gif">Projects</a>
        <a href="reflects/" data-gif="assets/main/tetsuo.gif">Reflects</a>
        <a href="art/" data-gif="assets/main/escape.gif">Art</a>
        <a href="soc/" data-gif="assets/main/goodfellas.gif">Summer of Code</a>
    </nav>

</body>

<script>

    window.addEventListener("load", function() {

    const rectangle = document.getElementById("mainRectangle")
    const links = document.querySelectorAll(".nav-links a")

    rectangle.style.backgroundImage = "url('assets/main/shinning.gif')"

    links.forEach(link => {
        link.addEventListener("mouseenter", () => {
            const gif = link.dataset.gif
            rectangle.style.backgroundImage = "url('" + gif + "')"
        })
    })
})

</script>

</html>
